[project]
name = "ai-analytics"
version = "0.1.0"
description = "Amazon US natural-language analytics assistant"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.0",
    "pandas>=2.2.0",
    "pyarrow>=19.0.0",
    "pyyaml>=6.0.0",
    "openai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pyodps>=0.13.2",
    "sqlglot>=27.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.9.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
