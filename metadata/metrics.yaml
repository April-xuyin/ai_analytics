version: 1
metrics:
  - name: sales_amount
    aliases: [销售额, 销售金额, 卖了多少钱, 销售收入, ordered product sales, product sales]
    dataset: dws_brand_day_us
    field: ordered_product_sales
    aggregation: SUM
    definition: US 销售额；排除订单状态 4、5，不含税，包含退退订单。
    dimensions: [brand, stat_dt]

  - name: order_count
    aliases: [订单数, 订单量, 卖了多少单, 卖了几单, order count]
    dataset: dws_brand_day_us
    field: order_cnt
    aggregation: SUM
    definition: US 净订单数；订单状态 4、5 已排除，按店铺和 Amazon 订单号去重。
    dimensions: [brand, stat_dt]

  - name: units_sold
    aliases: [销量, 销售数量, units ordered]
    dataset: dws_brand_day_us
    field: units_ordered
    aggregation: SUM
    definition: 排除订单状态 4、5 后的订购数量。
    dimensions: [brand, stat_dt]

  - name: refund_rate
    aliases: [退款率, 退货率]
    dataset: dws_brand_day_us
    field: refund_rate
    aggregation: weighted_ratio
    definition: 退款金额除以销售额；不能直接对多日退款率做 SUM 或简单 AVG。
    dimensions: [brand, stat_dt]

  - name: refund_amount
    aliases: [退款金额, 退货金额, refund amount]
    dataset: dws_brand_day_us
    field: refund_amount
    aggregation: SUM
    definition: 退款金额；与销售额使用相同的有效订单口径。
    dimensions: [brand, stat_dt]

  - name: high_value_order_cnt
    aliases: [高价值订单数, 高价值订单, 北极星订单]
    dataset: dws_brand_day_us
    field: high_value_order_cnt
    aggregation: SUM
    definition: 满足标价、毛利率和评分条件的高价值订单数。
    dimensions: [brand, stat_dt]

  - name: sku_sales_30d
    aliases: [SKU 30天销售额, 30天销售额, 30d sales]
    dataset: ads_aws_sku_period_sales
    field: ordered_product_sales_30d
    aggregation: value
    definition: SKU 自上架日起 0 到 30 天窗口内的销售额；该表一行一个 SKU，查询时不要再次按日期累加。
    dimensions: [seller_sku, asin, brand, shop_code]

  - name: sku_units_30d
    aliases: [SKU 30天销量, 30天销量, 30d units]
    dataset: ads_aws_sku_period_sales
    field: units_ordered_30d
    aggregation: value
    definition: SKU 自上架日起 0 到 30 天窗口内的销量。
    dimensions: [seller_sku, asin, brand, shop_code]

  - name: ad_spend_30d
    aliases: [30天广告费, 30天广告花费, 广告费, 广告花费]
    dataset: ads_aws_sku_period_sales
    field: ad_spend_30d
    aggregation: value
    definition: SKU 自上架日起 0 到 30 天窗口内的广告费。
    dimensions: [seller_sku, asin, brand, shop_code]

  - name: monthly_sales
    aliases: [月销售额, 月度销售额]
    dataset: ads_aws_sku_recap_month_detail
    field: recap_month_ordered_product_sales
    aggregation: SUM
    definition: 自然销售月销售额；沿用 NOT IN (4,5)、不含税、含退退口径。
    dimensions: [stat_month, brand, shop_name, seller_sku, asin]

  - name: north_star_achievement_rate
    aliases: [北极星达成率, 目标达成率]
    dataset: dws_brand_day_us
    field: high_value_order_cnt
    aggregation: ratio_to_target
    definition: 每日高价值订单数除以该自然月 daily_target；目标来自 dim_north_star_target。
    dimensions: [stat_dt, brand]
