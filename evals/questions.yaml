version: 1
description: Amazon US 智能问数代表性问题集；来源于现有 Quick BI 看板、ADS/DWS 主题和业务排查场景。

questions:
  # 品牌经营总览
  - id: brand_001
    category: 品牌经营
    question: 最近30天销售额最高的5个品牌是什么？
    paraphrases: [近一个月哪些品牌卖得最好, 过去30天品牌销售金额前五名]
    expected_datasets: [dws_brand_day_us]
    expected_metrics: [sales_amount]
    expected_dimensions: [brand]
    status: implemented

  - id: brand_002
    category: 品牌经营
    question: 最近30天各品牌的销售额、订单数和销量分别是多少？
    paraphrases: [近一个月各品牌卖了多少钱多少单, 看一下品牌近30天经营概况]
    expected_datasets: [dws_brand_day_us]
    expected_metrics: [sales_amount, order_count, units_sold]
    expected_dimensions: [brand]
    status: implemented

  - id: brand_003
    category: 品牌经营
    question: 最近30天销售额按天的趋势是什么？
    paraphrases: [近一个月每天销售额走势, 最近30天销售金额有没有下降]
    expected_datasets: [dws_brand_day_us]
    expected_metrics: [sales_amount]
    expected_dimensions: [stat_dt]
    status: implemented

  - id: brand_004
    category: 品牌经营
    question: 最近30天哪个品牌的退款金额最高？
    paraphrases: [近一个月退款最多的是哪个品牌, 品牌退款金额排名]
    expected_datasets: [dws_brand_day_us]
    expected_metrics: [refund_amount]
    expected_dimensions: [brand]
    status: ready

  - id: brand_005
    category: 品牌经营
    question: 最近30天各品牌的退款率是多少？
    paraphrases: [近一个月品牌退款比例, 哪个品牌退款率高]
    expected_datasets: [dws_brand_day_us]
    expected_metrics: [refund_rate]
    expected_dimensions: [brand]
    notes: 必须使用汇总退款金额除以汇总销售额，不能直接平均日退款率。
    status: implemented

  - id: brand_006
    category: 品牌经营
    question: 最近7天销售额相比前7天增长还是下降？
    paraphrases: [这周比上周卖得怎么样, 最近一周销售额环比]
    expected_datasets: [dws_brand_day_us]
    expected_metrics: [sales_amount]
    expected_dimensions: []
    status: ready

