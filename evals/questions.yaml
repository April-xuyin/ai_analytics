    expected_dimensions: [brand]
    status: ready

  # SKU 销售分析
  - id: sku_001
    category: SKU经营
    question: 最近30天销售额最高的10个SKU是什么？
    paraphrases: [近一个月SKU销售排名前十, 最近30天哪些商品卖得最好]
    expected_datasets: [dws_sku_tag_day_us]
    expected_metrics: [sales_amount]
    expected_dimensions: [seller_sku, asin]
    status: ready

  - id: sku_002
    category: SKU经营
    question: 最近30天销量最高但退款金额也较高的SKU有哪些？
    paraphrases: [哪些畅销SKU退款也多, 高销量高退款商品]
    expected_datasets: [dws_sku_tag_day_us]
    expected_metrics: [units_sold, refund_amount]
    expected_dimensions: [seller_sku, asin]
    notes: “较高”没有明确阈值时应追问，或明确采用排名规则。
    status: clarification_required

  - id: sku_003
    category: SKU经营
    question: 查询指定SKU最近30天每天的销售额、销量和订单数。
    paraphrases: [这个SKU近一个月每天卖多少, 看某SKU日销售趋势]
    expected_datasets: [dws_sku_tag_day_us]
    expected_metrics: [sales_amount, units_sold, order_count]
    expected_dimensions: [stat_dt, seller_sku, asin]
    notes: 用户必须提供 seller_sku 或 asin，否则需要追问。
    status: clarification_required

  - id: sku_004
    category: SKU经营
    question: 最近一个完整自然月各店铺销售额最高的5个SKU是什么？
    paraphrases: [上个月每个店铺的SKU销售前五, 店铺月度爆款排行]
    expected_datasets: [dws_sku_tag_day_us]
    expected_metrics: [sales_amount]
    expected_dimensions: [shop_code, seller_sku, asin]
    status: ready

  - id: sku_005
    category: SKU经营
    question: 最近30天毛利率低于20%的SKU有哪些？
    paraphrases: [近一个月低毛利SKU, 哪些商品毛利不到20%]
    expected_datasets: [dws_sku_tag_day_us]
    expected_metrics: [gross_margin_pct]
    expected_dimensions: [seller_sku, asin, brand]
    notes: 毛利率字段是月报快照属性，不应按日求和。
    status: ready

  # 新品冷启动和周期表现
  - id: lifecycle_001
    category: 新品冷启动
    question: 上架满30天但30天销量没有达到20单的SKU有哪些？
    paraphrases: [30天未达标新品, 哪些SKU过了30天还没卖到20件]
    expected_datasets: [ads_aws_sku_period_sales]
    expected_metrics: [sku_units_30d]
    expected_dimensions: [seller_sku, asin, brand, listing_date]
    status: implemented

  - id: lifecycle_002
    category: 新品冷启动
    question: 30天销量已经达到20单的SKU有哪些？
    paraphrases: [30天达标SKU名单, 新品成功商品有哪些]
    expected_datasets: [ads_aws_sku_period_sales]
    expected_metrics: [sku_units_30d]
    expected_dimensions: [seller_sku, asin, brand]
    status: ready

  - id: lifecycle_003
    category: 新品冷启动
    question: 各品牌上架满30天SKU的成功率是多少？
    paraphrases: [品牌新品30天达标率, 各品牌产品成功率]
    expected_datasets: [ads_aws_sku_period_sales]
    expected_metrics: [sku_units_30d]
    expected_dimensions: [brand]
    notes: 分母只包含上架满30天的SKU，分子为其中30天销量达到20的SKU。
    status: ready

  - id: lifecycle_004
    category: 新品冷启动
    question: 30天销售额最高的10个新品是什么？
    paraphrases: [新品30天销售排行, 冷启动销售额前十SKU]
    expected_datasets: [ads_aws_sku_period_sales]
    expected_metrics: [sku_sales_30d]
    expected_dimensions: [seller_sku, asin, brand]
    status: ready

  - id: lifecycle_005
    category: 新品冷启动
    question: 30天ACOS高于30%的SKU有哪些？
    paraphrases: [新品广告投入占销售额超过30%, 哪些SKU 30天广告效率差]
    expected_datasets: [ads_aws_sku_period_sales]
    expected_metrics: [ad_spend_30d, sku_sales_30d]
    expected_dimensions: [seller_sku, asin, brand]
    notes: ACOS = ad_spend_30d / ordered_product_sales_30d，销售额为0时返回NULL。
    status: ready

  - id: lifecycle_006
    category: 新品冷启动
    question: 30天退款率高于10%的SKU有哪些？
    paraphrases: [新品30天高退款商品, 哪些SKU上架30天内退款比例超过10%]
    expected_datasets: [ads_aws_sku_period_sales]
    expected_metrics: [refund_amount_30d, sku_sales_30d]
    expected_dimensions: [seller_sku, asin, brand]
    notes: 退款率 = refund_amount_30d / ordered_product_sales_30d。
    status: ready

  - id: lifecycle_007
    category: 新品冷启动
    question: 各上架月份的SKU数量和30天成功率趋势如何？
    paraphrases: [按上架批次看产品成功率, 每月上新数量和达标率]
