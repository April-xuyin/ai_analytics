  - id: north_star_001
    category: 北极星
    question: 最近30天每天的高价值订单数和目标达成率是多少？
    paraphrases: [近一个月北极星完成情况, 每天高价值订单有没有达标]
    expected_datasets: [dws_brand_day_us, dim_north_star_target]
    expected_metrics: [high_value_order_cnt, north_star_achievement_rate]
    expected_dimensions: [stat_dt]
    status: implemented

  - id: north_star_002
